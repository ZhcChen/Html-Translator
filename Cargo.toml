[workspace]
members = [
  "crates/html-translator-core",
  "crates/html-translator-mcp",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/ZhcChen/Html-Translator"

[workspace.dependencies]
kuchiki = "0.8.1"
rmcp = { version = "3.0.0-beta.3", features = ["transport-io"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
